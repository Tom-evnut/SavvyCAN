# Fork-only workflow: builds the Linux x64 AppImage and the Windows x64 package for this fork's branches.
# The two build jobs are copied from upstream's build.yml (as of QT6WIP 3288f1f), plus libusb-1.0 for the
# pico-flexray connection (flexray-pico): apt on Linux, vcpkg on Windows, with libusb-1.0.dll in the Windows
# package. Upstream's build.yml only runs on QT6WIP and also publishes a release and notifies Discord.
# A third job (unittests) builds and runs the standalone unit_tests/ harness via ctest so the pure-logic
# tests (e.g. the FlexRay slot x cycle aggregator) actually gate CI, not just the app compile.
name: Fork Build (Linux + Windows)

on:
  push:
    branches:
      - "fork-ci"
  workflow_dispatch:

jobs:
  buildlinux:
    name: Linux x64
    runs-on: ubuntu-22.04

    steps:
      - name: Prepare Environment
        run: |
            sudo apt-get install libxcb-icccm4 libxcb-image0 libxcb-cursor0 libxcb-keysyms1 libxcb-render-util0 libxcb-xinerama0 libxcb-randr0 libxkbcommon-x11-0 libfuse2 libusb-1.0-0-dev pkg-config

      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v4
        with:
           version: '6.10'
           modules: 'qtserialbus qtserialport'

      - name: Clone
        uses: actions/checkout@v3

      - name: Compile
        run: |
          cmake -B ${{github.workspace}}/build -S ${{github.workspace}} -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{github.workspace}}/build --config Release -j`grep -c ^processor /proc/cpuinfo`
          mv ${{github.workspace}}/build/SavvyCAN ${{github.workspace}}

      - name: Package
        run: |
          wget -c -nv "https://github.com/probonopd/linuxdeployqt/releases/download/continuous/linuxdeployqt-continuous-x86_64.AppImage"
          chmod a+x linuxdeployqt-continuous-x86_64.AppImage
          ./linuxdeployqt-continuous-x86_64.AppImage ./SavvyCAN.desktop -appimage -extra-plugins=iconengines,platformthemes/libqgtk3.so,canbus,tls

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-Linux_x64.AppImage
          path: SavvyCAN-*x86_64.AppImage

  buildwindows:
    name: Windows x64
    runs-on: windows-2022

    steps:
      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v4
        with:
           version: '6.10'
           modules: 'qtserialbus qtserialport'

      - name: Clone
        uses: actions/checkout@v3

      - name: Prepare libusb
        shell: cmd
        run: '"%VCPKG_INSTALLATION_ROOT%\vcpkg" install libusb:x64-windows'

      - name: Compile
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -B ${{github.workspace}}/build -S ${{github.workspace}} -DCMAKE_BUILD_TYPE=Release -DLIBUSB_INCLUDE_DIR="%VCPKG_INSTALLATION_ROOT%/installed/x64-windows/include/libusb-1.0" -DLIBUSB_LIBRARY="%VCPKG_INSTALLATION_ROOT%/installed/x64-windows/lib/libusb-1.0.lib"
          cmake --build ${{github.workspace}}/build --config Release -j 2

      - name: Package
        run: |
          mkdir package
          copy "build/release/SavvyCAN.exe" package/
          mkdir package/help
          copy  translations/*.qm package/translations/
          copy  help/*.md package/help/
          mkdir package/help/images
          copy help/images/*.* package/help/images/
          mkdir package/examples
          copy examples/*.* package/examples/
          copy "${Env:QT_ROOT_DIR}/bin/Qt6Core.dll" package/
          copy "${Env:QT_ROOT_DIR}/bin/Qt6Gui.dll" package/
          copy "${Env:QT_ROOT_DIR}/bin/Qt6Network.dll" package/
          copy "${Env:QT_ROOT_DIR}/bin/Qt6PrintSupport.dll" package/
          copy "${Env:QT_ROOT_DIR}/bin/Qt6Qml.dll" package/
          copy "${Env:QT_ROOT_DIR}/bin/Qt6SerialBus.dll" package/
          copy "${Env:QT_ROOT_DIR}/bin/Qt6SerialPort.dll" package/
          copy "${Env:QT_ROOT_DIR}/bin/Qt6Widgets.dll" package/
          copy "${Env:VCPKG_INSTALLATION_ROOT}/installed/x64-windows/bin/libusb-1.0.dll" package/
          copy "${Env:QT_ROOT_DIR}/bin/Qt6OpenGL.dll" package/
          mkdir package/imageformats
          copy "${Env:QT_ROOT_DIR}/plugins/imageformats/*.*" package/imageformats/
          mkdir package/platforms
          copy "${Env:QT_ROOT_DIR}/plugins/platforms/*.*" package/platforms/
          mkdir package/styles
          copy "${Env:QT_ROOT_DIR}/plugins/styles/*.*" package/styles/
          mkdir package/canbus
          copy "${Env:QT_ROOT_DIR}/plugins/canbus/*.*" package/canbus/
          mkdir package/tls
          copy "${Env:QT_ROOT_DIR}/plugins/tls/*.*" package/tls/

      - uses: actions/upload-artifact@v4
        with:
          name: SavvyCAN-Windows_x64
          path: package

  unittests:
    name: Unit tests (Linux)
    runs-on: ubuntu-22.04

    steps:
      - name: Prepare Qt Libraries
        uses: jurplel/install-qt-action@v4
        with:
           version: '6.10'
           modules: 'qtserialbus qtserialport'

      - name: Clone
        uses: actions/checkout@v3

      # The unit_tests/ directory is a standalone CMake project. Configure it, build only the
      # FlexRay aggregator test target, and run it through ctest so a failed assertion fails CI.
      # --no-tests=error makes an empty test selection a hard error (so a rename can't silently skip it).
      - name: Build and run unit tests
        run: |
          cmake -B ${{github.workspace}}/build-tests -S ${{github.workspace}}/unit_tests -DCMAKE_BUILD_TYPE=Release
          cmake --build ${{github.workspace}}/build-tests --config Release --target TestFlexRaySchedule -j`grep -c ^processor /proc/cpuinfo`
          ctest --test-dir ${{github.workspace}}/build-tests -R TestFlexRaySchedule --output-on-failure --no-tests=error
